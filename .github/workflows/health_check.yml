name: Periodic health check

on:
  schedule:
    # once a day (UTC), to avoid using up the monthly free minutes
    - cron: '0 15 * * *'
  # lets you run it by hand from the Actions tab while testing
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed app
        uses: jtalk/url-health-check-action@v4
        with:
          # CHANGE THIS to the URL of your deployed app
          url: https://YOUR-APP-NAME.fly.dev/health
          max-attempts: 3
          retry-delay: 5s
